# What the server needs to run sandbox Jobs (src/sandbox/): its pod IP for
# the Jobs to call back to, the internal port they use, the Job template, and
# a short-lived token for the Kubernetes API. The pod keeps
# automountServiceAccountToken: false; the token is projected explicitly so
# that it expires after an hour (the kubelet rotates it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  template:
    spec:
      containers:
        - name: server
          ports:
            # Not in the Service, so not behind the Gateway; the NetworkPolicy
            # only admits sandbox pods.
            - name: sandbox
              containerPort: 8081
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TROP_SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TROP_SANDBOX_RUNNER
              value: kubernetes
            - name: TROP_SANDBOX_PORT
              value: "8081"
            - name: TROP_SANDBOX_JOB_TEMPLATE
              value: /etc/trop/sandbox-job.yaml
            # The tag follows the server image's (deploy/overlays/prod
            # replacements), so both always come from the same commit.
            - name: TROP_SANDBOX_IMAGE
              value: electronionicplatform.azurecr.io/trop-sandbox:main
          volumeMounts:
            - name: sandbox-job-template
              mountPath: /etc/trop
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: sandbox-job-template
          configMap:
            name: sandbox-job-template
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - { key: ca.crt, path: ca.crt }
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
