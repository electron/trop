# Rules between trop's own pods. The server's boundary rules (the Envoy
# Gateway and the Datadog agents in, DNS and public 443 out) are the
# `platform-server` NetworkPolicy owned by electron/infra
# (terraform/global/ionic-platform-apps/network-policies.tf), next to its
# `platform-default-deny`; an admission policy there rejects any policy here
# that names an ipBlock, another namespace or every peer.
#
# Peers are selected with matchExpressions. Kustomize label transformers never
# rewrite matchExpressions, so these select exactly what they say in the
# rendered output too.
#
# Anything else added to this namespace (e.g. a CronJob) needs its own policy:
# by default it can neither send nor receive anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [server] }
  policyTypes: [Ingress, Egress]
  ingress:
    # Sandbox jobs: their inputs, read-only git fetches and their result.
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/part-of, operator: In, values: [trop] }
              - { key: app.kubernetes.io/component, operator: In, values: [sandbox] }
      ports:
        - { protocol: TCP, port: 8081 }
---
# Sandbox jobs talk to the server's internal port and nothing else: no DNS,
# no internet, no other pod. Nothing may connect to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/part-of, operator: In, values: [trop] }
      - { key: app.kubernetes.io/component, operator: In, values: [sandbox] }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [server] }
      ports:
        - { protocol: TCP, port: 8081 }
