# Backports apply untrusted patches with git, so that work runs in ephemeral
# sandbox Jobs (src/sandbox/): no credentials, no service-account token, no
# DNS, and no network peer but the server's internal port (see
# networkpolicies.yaml). The server builds each Job from the template below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
# Never granted anything; it only exists so sandbox pods don't run as
# `default` or as `server` (which has an Azure workload identity).
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-job-template
data:
  # Kustomize does not see into this string, so the labels the
  # NetworkPolicies select on are written out here (and the server sets them
  # again on every Job). The server refuses a template that weakens any of
  # the settings it checks (src/sandbox/kubernetes.ts assertSafeJobTemplate).
  sandbox-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        app.kubernetes.io/name: sandbox
        app.kubernetes.io/part-of: trop
        app.kubernetes.io/component: sandbox
    spec:
      backoffLimit: 0
      # The server gives up after 40 minutes (TROP_SANDBOX_TIMEOUT_MS; up to
      # 15 of them, TROP_SANDBOX_SCHEDULING_TIMEOUT_MS, waiting for a sandbox
      # node to come up) and deletes the Job; these, and garbage collection
      # once the owning server pod is gone, are the backstops if it can't.
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sandbox
            app.kubernetes.io/part-of: trop
            app.kubernetes.io/component: sandbox
        spec:
          serviceAccountName: sandbox
          automountServiceAccountToken: false
          enableServiceLinks: false
          hostNetwork: false
          hostPID: false
          hostIPC: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 5
          # No DNS: the job reaches the server by IP. Nothing listens on
          # 127.0.0.1:53, so any lookup fails at once (and the NetworkPolicy
          # drops DNS traffic anyway).
          dnsPolicy: None
          dnsConfig:
            nameservers: ["127.0.0.1"]
          # The tainted sandbox node pool, away from the server and every
          # other app's pods.
          nodeSelector:
            electronjs.org/pool: sandbox
          tolerations:
            - key: electronjs.org/sandbox
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sandbox
              # Replaced by the server with TROP_SANDBOX_IMAGE.
              image: electronionicplatform.azurecr.io/trop-sandbox:main
              env:
                - name: TROP_SANDBOX_WORKDIR
                  value: /work
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 3Gi
                  ephemeral-storage: 6Gi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            # A shallow, blob-less checkout of the target branch.
            - name: work
              emptyDir:
                sizeLimit: 4Gi
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
