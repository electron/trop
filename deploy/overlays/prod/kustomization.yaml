apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Run sandbox Jobs from the same commit as the server: copy the server image's
# tag (set by CI through ArgoCD's kustomize image override, which applies
# before replacements) onto TROP_SANDBOX_IMAGE. CI pushes trop-sandbox:<sha>
# before it deploys (.github/workflows/build-image.yml).
replacements:
  - source:
      kind: Deployment
      name: server
      fieldPath: spec.template.spec.containers.[name=server].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: server
        fieldPaths:
          - spec.template.spec.containers.[name=server].env.[name=TROP_SANDBOX_IMAGE].value
        options:
          delimiter: ":"
          index: 1
replicas:
  # Exactly one: trop's in-process queue and per-repo mutexes guard a single
  # shared clone, so a second pod would race it.
  - name: server
    count: 1
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: trop.electronjs.org
  # Bare electron/electron clone under /tmp/trop-working. A strategic merge
  # (by volume name), since the base adds volumes ahead of this one.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: server
      spec:
        template:
          spec:
            volumes:
              - name: tmp
                emptyDir:
                  sizeLimit: 20Gi
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /ping
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /ping
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: BOT_USER_NAME, value: "trop[bot]" }
      # Carried over from Heroku; no code reads it since #398.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: COMMITTER_USER_NAME, value: electron-bot }
      # Datadog: the cluster's DatadogAgent (electron/infra
      # argo/ionic-platform/datadog) already ships stdout logs, and its
      # prometheusScrape feature picks up these annotations to scrape trop's
      # prom-client /metrics. No DD_API_KEY or in-pod agent needed.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: /metrics
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 1Gi }
          limits: { memory: 4Gi }
