apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  # Exactly one: trop's in-process queue and per-repo mutexes guard a single
  # shared clone, so a second pod would race it.
  - name: server
    count: 1
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: trop.electronjs.org
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /ping
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /ping
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: BOT_USER_NAME, value: "trop[bot]" }
      # Carried over from Heroku; no code reads it since #398.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: COMMITTER_USER_NAME, value: electron-bot }
      # Datadog: the cluster's DatadogAgent (electron/infra
      # argo/ionic-platform/datadog) already ships stdout logs, and its
      # prometheusScrape feature picks up these annotations to scrape trop's
      # prom-client /metrics. No DD_API_KEY or in-pod agent needed.
      - op: add
        path: /spec/template/metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: /metrics
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 1Gi }
          limits: { memory: 4Gi }
      # Bare electron/electron clone plus per-job worktrees under
      # /tmp/trop-working.
      - op: replace
        path: /spec/template/spec/volumes/0/emptyDir
        value: { sizeLimit: 20Gi }
