name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The sandbox image the server runs backport Jobs from
  # (deploy/base/sandbox.yaml). Pushed before the deploy below, which also
  # moves the Jobs to the new tag (deploy/overlays/prod replacements). Same
  # pinned actions as ionic-kit's deploy.yml; the CI-push identity needs
  # trop-sandbox in its ACR repositories (electron/infra ionic-platform-apps
  # acr_extra_repositories).
  build-sandbox:
    name: Build & push sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: electronionicplatform.azurecr.io/trop-sandbox
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      # docker/setup-buildx-action v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # azure/login v3.0.0
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ secrets.IONIC_PLATFORM_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IONIC_PLATFORM_AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name electronionicplatform
      # docker/build-push-action v7.0.0
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          target: sandbox
          platforms: linux/amd64
          push: true
          # The sha tag is the one deploys use (deploy/overlays/prod). The
          # branch tag only for main: other branch names can contain `/`,
          # which a tag can't.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

  deploy:
    needs: build-sandbox
    permissions:
      contents: read
      id-token: write
    uses: electron/ionic-kit/.github/workflows/deploy.yml@5fe23c0391cb22be6fea400cd0e2ad56bd54f55d # main @ 2026-10-22
    with:
      app: trop # ArgoCD Application name; must match the app's ionic-platform-apps entry in infra
      argocd_server: ${{ vars.ARGOCD_SERVER }}
      shared_vault: ${{ vars.IONIC_SHARED_VAULT }}
    secrets:
      AZURE_ACR_PUSH_CLIENT_ID: ${{ secrets.AZURE_ACR_PUSH_CLIENT_ID }}
      IONIC_PLATFORM_AZURE_TENANT_ID: ${{ secrets.IONIC_PLATFORM_AZURE_TENANT_ID }}
      IONIC_PLATFORM_AZURE_SUBSCRIPTION_ID: ${{ secrets.IONIC_PLATFORM_AZURE_SUBSCRIPTION_ID }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
